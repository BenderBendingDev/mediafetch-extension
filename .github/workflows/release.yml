name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify tag and package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Run extension end-to-end tests
        run: pnpm test:e2e:ci

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build and normalize Chromium ZIP
        shell: bash
        run: |
          pnpm zip
          shopt -s nullglob
          archives=(.output/*-chrome.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected exactly one Chromium ZIP, found ${#archives[@]}"
            exit 1
          fi
          mkdir -p dist
          cp "${archives[0]}" "dist/mediafetch-${RELEASE_VERSION}-chromium.zip"

      - name: Download corresponding ffmpeg.wasm source
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/ffmpegwasm/ffmpeg.wasm/archive/71aa99d37c02a7b4c435275ca9ef50e612f6efa1.tar.gz" \
            --output "dist/ffmpeg.wasm-core-0.12.10-source.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/ffmpegwasm/ffmpeg.wasm/archive/c3a763857c5e615ae8674715ad5e4f63ff469e9d.tar.gz" \
            --output "dist/ffmpeg.wasm-v0.12.10-source.tar.gz"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .output/chrome-mv3
          format: spdx-json
          output-file: dist/mediafetch-${{ env.RELEASE_VERSION }}-sbom.spdx.json
          upload-artifact: false

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum \
            "mediafetch-${RELEASE_VERSION}-chromium.zip" \
            "ffmpeg.wasm-core-0.12.10-source.tar.gz" \
            "ffmpeg.wasm-v0.12.10-source.tar.gz" \
            "mediafetch-${RELEASE_VERSION}-sbom.spdx.json" \
            > SHA256SUMS

      - name: Attest build provenance
        if: ${{ github.repository_visibility == 'public' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/mediafetch-${{ env.RELEASE_VERSION }}-chromium.zip
            dist/mediafetch-${{ env.RELEASE_VERSION }}-sbom.spdx.json

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "MediaFetch $GITHUB_REF_NAME"
          fi
